[package]
name = "pi_calc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
libmimalloc-sys = "0.1"
mimalloc = { version = "0.1", default-features = false }
# use-system-libs: GMP comes from build_flint.sh, not from a build inside cargo.
gmp-mpfr-sys = { version = "1.7.1", default-features = false, features = ["use-system-libs", "force-cross"] }
rug = { version = "1.30.0", default-features = false, features = ["integer", "std"] }
